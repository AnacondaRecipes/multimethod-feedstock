{% set name = "multimethod" %}
{% set version = "2.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: c59e75fbe51516ed632d3df4b56df0876747be001c068d3ee1e83e9f65c2846f

build:
  number: 0
  skip: true  # [py<311]
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - pip
    - python
    - setuptools
  run:
    - python

test:
  source_files:
    - tests
  imports:
    - multimethod
  requires:
    - pip
    - pytest
  commands:
    - pip check
    - pytest -v tests

about:
  home: https://github.com/coady/multimethod
  description: |
    Multimethod provides a decorator for adding multiple argument dispatching to functions.
    The decorator creates a multimethod object as needed, and registers the function
    with its annotations.
  license: Apache-2.0
  license_family: APACHE
  license_file: LICENSE.txt
  summary: Multiple argument dispatching.
  dev_url: https://github.com/coady/multimethod
  doc_url: https://multimethod.readthedocs.io

extra:
  recipe-maintainers:
    - albop
